<h1>个人备份工具</h1>
<p>这是一个个人使用的备份工具主页。它用开源软件 restic + rclone，把我自己电脑里的文件加密备份到我自己的 Google Drive（网盘文件夹 Muse-Backup-Restic），每天自动跑一次，只传有变化的部分，每个文件保留最近 7 个版本，可回退。</p>
<h2>它做什么</h2>
<ul>
<li>每天自动把本机文件加密备份到我自己的 Google Drive。</li>
<li>只备份我自己的文件，不收集、不上传任何其他人的数据。</li>
<li>备份是加密的，只有我持有解密密码才能打开。</li>
</ul>
<h2>联系</h2>
<p class="small">这是个人项目，不对外提供服务。如有问题请通过 GitHub 联系。</p>
